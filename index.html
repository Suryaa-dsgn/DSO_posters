<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Quickflows.ai — AI-Powered Workflow Automation for Dental Practices &amp; DSOs</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* ── POSTER ── */

    .poster-container {
      position: relative;
      width: 100%;
      max-width: 900px;
      margin: 0 auto;
    }

    .poster-img {
      display: block;
      width: 100%;
      height: auto;
      user-select: none;
      -webkit-user-drag: none;
      pointer-events: none;
    }

    /* ── OVERLAY ZONES ── */

    .zone {
      position: absolute;
      cursor: pointer;
      background: transparent;
      border-radius: 6px;
      transition: background 0.18s ease, box-shadow 0.18s ease;
      -webkit-tap-highlight-color: transparent;
    }

    .zone:hover {
      background: rgba(124, 58, 237, 0.08);
      box-shadow: inset 0 0 0 1.5px rgba(124, 58, 237, 0.45);
    }

    .zone:active {
      background: rgba(124, 58, 237, 0.16);
    }

    .zone:focus-visible {
      outline: 2px solid rgba(124, 58, 237, 0.7);
      outline-offset: 2px;
    }

    .demo-zone {
      display: block;
      text-decoration: none;
    }

    .demo-zone:hover {
      background: rgba(255, 255, 255, 0.07);
      box-shadow: none;
    }

    /* ── MODAL BACKDROP ── */

    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.9);
      z-index: 1000;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 16px 12px 32px;
      overflow-y: auto;

      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease;
    }

    .modal-backdrop.open {
      opacity: 1;
      pointer-events: all;
    }

    /* ── MODAL BOX ── */

    .modal-box {
      width: 100%;
      max-width: 680px;
      display: flex;
      flex-direction: column;
      gap: 12px;
      transform: translateY(20px);
      transition: transform 0.25s ease;
    }

    .modal-backdrop.open .modal-box {
      transform: translateY(0);
    }

    /* ── MODAL HEADER ── */

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 2px;
    }

    .btn-back {
      background: rgba(255, 255, 255, 0.1);
      border: 0.5px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      font-size: 13px;
      font-weight: 500;
      padding: 10px 18px;
      border-radius: 24px;
      cursor: pointer;
      font-family: inherit;
      transition: background 0.15s;
      min-height: 44px;
    }

    .btn-back:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .btn-close {
      background: rgba(255, 255, 255, 0.1);
      border: 0.5px solid rgba(255, 255, 255, 0.22);
      color: #fff;
      width: 44px;
      height: 44px;
      border-radius: 50%;
      font-size: 15px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: inherit;
      transition: background 0.15s;
      flex-shrink: 0;
    }

    .btn-close:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    /* ── MODAL POSTER ── */

    .modal-poster-wrap {
      position: relative;
      width: 100%;
      border-radius: 10px;
      overflow: hidden;
      background: #080814;
      box-shadow: 0 0 0 0.5px rgba(124, 58, 237, 0.3);
    }

    .modal-poster-img {
      display: block;
      width: 100%;
      height: auto;
    }

    /* ── MODAL SUB-POSTER CTA ZONE ── */

    .modal-cta-zone {
      position: absolute;
      top: 94%;
      left: 46%;
      width: 36%;
      height: 3.5%;
      display: block;
      text-decoration: none;
      border-radius: 8px;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.18s ease, box-shadow 0.18s ease;
    }

    .modal-cta-zone:hover {
      background: rgba(255, 255, 255, 0.07);
    }

    .modal-cta-zone:active {
      background: rgba(255, 255, 255, 0.13);
    }
  </style>
</head>
<body>

  <!-- MAIN POSTER -->
  <div class="poster-container">
    <img
      src="images/main-poster.png"
      alt="Quickflows.ai — AI-Powered Workflow Automation for Dental Practices and DSOs"
      class="poster-img"
    />

    <!-- CARD OVERLAY ZONES (6 total) -->
    <!-- Row 1 — measured top:31%, ends at ~49% -->
    <div class="zone" data-poster="scheduling"
      role="button" tabindex="0"
      aria-label="Open Appointment Scheduling and Chair Optimization"
      style="top:31%; left:2%; width:31%; height:18%;">
    </div>

    <div class="zone" data-poster="insurance"
      role="button" tabindex="0"
      aria-label="Open Insurance Verification and Prior Authorization"
      style="top:31%; left:34%; width:31%; height:18%;">
    </div>

    <div class="zone" data-poster="intake"
      role="button" tabindex="0"
      aria-label="Open Patient Intake and Documentation"
      style="top:31%; left:67%; width:31%; height:18%;">
    </div>

    <!-- Row 2 — measured top:50%, ends at ~66% -->
    <div class="zone" data-poster="revenue"
      role="button" tabindex="0"
      aria-label="Open Revenue Cycle and Claims Intelligence"
      style="top:50%; left:2%; width:31%; height:16%;">
    </div>

    <div class="zone" data-poster="treatment"
      role="button" tabindex="0"
      aria-label="Open Treatment Plan Follow-Up and Acceptance"
      style="top:50%; left:34%; width:31%; height:16%;">
    </div>

    <div class="zone" data-poster="staffing"
      role="button" tabindex="0"
      aria-label="Open Staffing and Operational Intelligence"
      style="top:50%; left:67%; width:31%; height:16%;">
    </div>

    <!-- DEMO CTA ZONE — pixel-scanned: left:46%, width:36%, top:94%, height:3.5% -->
    <a class="zone demo-zone"
      href="mailto:K.mcdonnell@quickflows.ai?subject=DSO%20Demo%20Request%20%E2%80%94%20Quickflows.ai"
      aria-label="Schedule a demo — opens email"
      style="top:94%; left:46%; width:36%; height:3.5%;">
    </a>
  </div>

  <!-- MODAL LIGHTBOX -->
  <div class="modal-backdrop" id="modal" aria-hidden="true" aria-modal="true" role="dialog">
    <div class="modal-box" id="modal-box">

      <div class="modal-header">
        <button class="btn-back" onclick="closeModal()">&#8592; Back to All Features</button>
        <button class="btn-close" onclick="closeModal()" aria-label="Close">&#x2715;</button>
      </div>

      <div class="modal-poster-wrap">
        <img src="" alt="" class="modal-poster-img" id="modal-img" />
        <a class="modal-cta-zone"
          href="mailto:K.mcdonnell@quickflows.ai?subject=DSO%20Demo%20Request%20%E2%80%94%20Quickflows.ai"
          aria-label="Schedule a demo — opens email">
        </a>
      </div>

    </div>
  </div>

  <script>
    const POSTERS = {
      'scheduling': { src: 'images/scheduling.png', alt: 'Appointment Scheduling & Chair Optimization' },
      'insurance':  { src: 'images/insurance.png',  alt: 'Insurance Verification & Prior Authorization' },
      'intake':     { src: 'images/intake.png',     alt: 'Patient Intake & Documentation' },
      'revenue':    { src: 'images/revenue.png',    alt: 'Revenue Cycle & Claims Intelligence' },
      'treatment':  { src: 'images/treatment.png',  alt: 'Treatment Plan Follow-Up & Acceptance' },
      'staffing':   { src: 'images/staffing.png',   alt: 'Staffing & Operational Intelligence' },
    };

    const modal    = document.getElementById('modal');
    const modalImg = document.getElementById('modal-img');
    const modalBox = document.getElementById('modal-box');

    function openModal(id) {
      const p = POSTERS[id];
      if (!p) return;
      modalImg.src = p.src;
      modalImg.alt = p.alt;
      modal.classList.add('open');
      modal.setAttribute('aria-hidden', 'false');
      modal.scrollTop = 0;
      document.body.style.overflow = 'hidden';
    }

    function closeModal() {
      modal.classList.remove('open');
      modal.setAttribute('aria-hidden', 'true');
      document.body.style.overflow = '';
      setTimeout(function() { modalImg.src = ''; }, 280);
    }

    // Zone clicks + keyboard support
    document.querySelectorAll('.zone[data-poster]').forEach(function(zone) {
      zone.addEventListener('click', function() { openModal(zone.dataset.poster); });
      zone.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          openModal(zone.dataset.poster);
        }
      });
    });

    // Close on backdrop click
    modal.addEventListener('click', function(e) {
      if (!modalBox.contains(e.target)) closeModal();
    });

    // Close on Escape
    document.addEventListener('keydown', function(e) {
      if (e.key === 'Escape' && modal.classList.contains('open')) closeModal();
    });
  </script>
</body>
</html>
